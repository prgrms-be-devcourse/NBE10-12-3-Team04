spring:
  application:
    name: triptrace
  config:
    # 로컬 전용 비밀 설정. git에 커밋되지 않으므로 optional 로 둔다.
    import: optional:classpath:application-secret.yaml
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  datasource:
    hikari:
      auto-commit: false
  # SMTP 실제 값은 application-secret.yaml 또는 환경변수로 주입한다.
  # host가 비어 있으면 JavaMailSender 빈이 만들어지지 않아 컨텍스트 로딩이 실패하므로 기본값을 둔다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  servlet:
    multipart:
      max-file-size: ${IMAGE_FILE_SIZE:10MB}
      max-request-size: ${MAX_IMAGE_FILES_SIZE:100MB}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIME_ZONE:Asia/Seoul}
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

mail:
  from: ${MAIL_FROM:noreply@triptrace.com}

springdoc:
  default-produces-media-type: application/json;charset=UTF-8

logging:
  level:
    com.triptrace: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE

custom:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secretKey: ${JWT_SECRET_KEY:abcdefghijklmnopqrstuvwxyz0123456789}
  accessToken:
    expirationSeconds: ${ACCESS_TOKEN_EXPIRATION_SECONDS:18000} # 5시간
  refreshToken:
    expirationSeconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800} # 7일
  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
  ext:
    jpg: jpeg
  upload:
    # DB에는 /images/... 상대 경로를 저장하고, 실제 파일은 이 로컬 저장 루트 아래에 둔다.
    path: ${IMAGE_UPLOAD:/app/images}
    serving-path: ${SERVING_UPLOAD_PATH:/images/serving}
    thumbnail-path: ${THUMBNAIL_UPLOAD_PATH:/images/thumbnail}
    profile-path: ${PROFILE_UPLOAD_PATH:/images/profile}
    public-prefix: ${PUBLIC_PREFIX:/}
  thumbnail:
    width: ${THUMBNAIL_WIDTH:1024}
    height: ${THUMBNAIL_HEIGHT:1024}
